name: Validate SwitchBeats editor
on:
  push:
    branches: [switchbeats]
  pull_request:
    branches: [switchbeats]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.0'
      - name: Check devices and recorder lifecycle
        run: node --test test/audio-devices.test.cjs test/recorder.test.cjs
      - name: Install isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/studio-test" --no-save --ignore-scripts playwright@1.62.1
          node "$RUNNER_TEMP/studio-test/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify synthetic recording and embedded bridge
        run: |
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/studio-test/node_modules/playwright"
          node test/recording-browser.cjs
